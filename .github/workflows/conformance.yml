name: Conformance

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  packages: read

jobs:
  conformance:
    uses: intisy/workflows/.github/workflows/conformance.yml@main
    with:
      kit_repository: weivel/conformance
      toolchains: node gradle
      driver_build: ./gradlew :conformance-driver:jar
      driver: java -jar conformance-driver/build/libs/conformance-driver.jar
      extra_repositories: weivel/model model
    secrets:
      envPAT: ${{ secrets.PAT }}
