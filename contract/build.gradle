// compileOnly is right: every annotation is SOURCE-retention except @TsLiteral, which jvm-seam reads at
// run time and carries :annotations for; a JVM ignores an annotation whose class is absent.
dependencies {
    compileOnly project(":annotations")
    annotationProcessor project(":processor")
}

tasks.named("compileJava") {
    // This module's keys file IS the package root, so it re-exports the surface it sits beside:
    // one generated entry point serving both the types a consumer imports and API_VERSION.
    options.compilerArgs += ["-Atsemit.reexport=true"]
}
