plugins {
    id "io.github.intisy.github-gradle" version "1.10.3" apply false
}

// weivel/model is named by -Dmodel.schema, the path of its plugin.schema.json; else it is checked out
// inside this repository, where CI puts the sibling, else beside it. A named path is held to it.
ext.modelSchemaCandidates = { ->
    def named = System.getProperty("model.schema")
    named != null
        ? [rootProject.file(named)]
        : [rootProject.file("model/plugin.schema.json"), rootProject.file("../model/plugin.schema.json")]
}
ext.modelSchema = { -> modelSchemaCandidates().find { it.isFile() } ?: modelSchemaCandidates()[0] }

subprojects {
    apply plugin: "java-library"
    apply plugin: "io.github.intisy.github-gradle"

    group = "io.github.intisy"
    // publishGithub requires a concrete version. Derive it from -Partifact_version=<tag> passed by
    // CI (stripping a leading "v"), falling back to a local dev version, the ecosystem derivation.
    version = (project.findProperty("artifact_version") ?: "0.0.0-dev").toString().replaceFirst(/^v/, "")

    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // All Java source, main and test alike, must stay within the JDK 1.8 API surface; javac enforces it.
    tasks.matching { it.name == "compileJava" || it.name == "compileTestJava" }.configureEach {
        options.release = 8
    }

    // `@apiNote`, `@implSpec` and `@implNote` are reserved for the JDK's own build, so the standard
    // doclet rejects them until a project registers them. CLAUDE.md requires @implNote for internal
    // rationale, so without this every such comment is a javadoc error rather than documentation.
    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption("Xdoclint:all", true)
        // javadoc stops listing after 100 of each by default, which silently under-reports the gap.
        options.addStringOption("Xmaxwarns", "10000")
        options.addStringOption("Xmaxerrs", "10000")
        // doclint reports a missing comment as a WARNING, and failOnError only fails on errors, so
        // without this the task passes over an entirely undocumented module.
        options.addBooleanOption("Werror", true)
        options.tags = [
            "apiNote:a:API Note:",
            "implSpec:a:Implementation Requirements:",
            "implNote:a:Implementation Note:",
        ]
        failOnError = true
    }

    tasks.named("check") { dependsOn tasks.named("javadoc") }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    }

    test {
        useJUnitPlatform()
    }

    github {
        accessToken = System.getenv("GITHUB_TOKEN") ?: ""
    }

    // A consumer resolves each module by its own classifier, because they serve different Gradle
    // configurations: :processor is an annotationProcessor, :annotations and :contract are
    // compileOnly, :seam and :js-base are implementation. One shaded jar would put the annotation
    // processor on every consumer's runtime classpath, which the plugin-weight rule forbids.
    tasks.matching { it.name == "publishGithub" }.configureEach {
        onlyIf { project.path in PUBLISHED_MODULES.keySet() }
    }
}

// The modules a downstream Java repo resolves, mapped to the classifier its coordinate names.
// :teavm is absent deliberately: it feeds this library's npm package, not any Java consumer.
// :engine was absent for the same reason until ai-java became a JVM host of the plugin model, which
// is what it exists to run. It needs nothing beside it: its only dependencies are the annotations
// and the processor, both SOURCE-retention, so the classifier jar stands alone.
ext.PUBLISHED_MODULES = [
    ":annotations": "annotations",
    ":processor"  : "processor",
    ":contract"   : "contract",
    ":engine"     : "engine",
    ":seam"       : "seam",
    ":js-base"    : "js-base",
    ":jvm-seam"   : "jvm-seam",
]

configure(subprojects.findAll { PUBLISHED_MODULES.containsKey(it.path) }) {
    jar {
        archiveVersion = ""
    }

    publishGithub {
        // These modules sit inside the repo with no .git of their own, so the default
        // git-remote lookup fails; owner/repo also drive the uploaded asset name
        // (java-<classifier>.jar), which is what a consumer's coordinate resolves.
        owner = "weivel"
        repo = "java"
        releaseName = "java ${project.findProperty('artifact_version') ?: project.version}"
        artifacts {
            artifact {
                classifier = PUBLISHED_MODULES[project.path]
                jar = file("build/libs/${project.name}.jar")
            }
        }
    }
}
